services:
  flutter:
    image: ghcr.io/cirruslabs/flutter:3.7.12
    volumes:
      - ./:/app
    working_dir: /app
    command: >-
      sh -ec "
      flutter config --enable-web &&
      flutter pub get &&
      exec flutter run -d web-server --web-port=8080 --web-hostname=0.0.0.0
      --dart-define=FIREBASE_API_KEY=$$FIREBASE_API_KEY
      --dart-define=FIREBASE_AUTH_DOMAIN=$$FIREBASE_AUTH_DOMAIN
      --dart-define=FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID
      --dart-define=FIREBASE_STORAGE_BUCKET=$$FIREBASE_STORAGE_BUCKET
      --dart-define=FIREBASE_MESSAGING_SENDER_ID=$$FIREBASE_MESSAGING_SENDER_ID
      --dart-define=FIREBASE_APP_ID=$$FIREBASE_APP_ID
      "
    environment:
      - BASE44_PREVIEW_MODE=1
    env_file:
      - /run/base44/app.env
    expose:
      - "8080"
    restart: on-failure
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  couchdb:
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=123321k
    expose:
      - "5984"
    volumes:
      - couchdb_data:/usr/local/var/lib/couchdb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flutter:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 200s
    restart: on-failure

  seed:
    image: curlimages/curl:8.5.0
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - ./couchdb-seed.sh:/seed.sh:ro
    command: ["sh", "/seed.sh"]
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=123321k
    restart: "no"

volumes:
  couchdb_data:
