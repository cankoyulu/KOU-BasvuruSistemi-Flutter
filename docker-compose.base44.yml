services:
  flutter:
    image: ghcr.io/cirruslabs/flutter:3.7.12
    volumes:
      - ./:/app
    working_dir: /app
    command: >-
      sh -ec "
      flutter config --enable-web &&
      flutter pub get &&
      sh /app/gen-firebase-config.sh &&
      BUILD_CMD='flutter build web --web-renderer html
      --dart-define=FIREBASE_API_KEY=$$FIREBASE_API_KEY
      --dart-define=FIREBASE_AUTH_DOMAIN=$$FIREBASE_AUTH_DOMAIN
      --dart-define=FIREBASE_PROJECT_ID=$$FIREBASE_PROJECT_ID
      --dart-define=FIREBASE_STORAGE_BUCKET=$$FIREBASE_STORAGE_BUCKET
      --dart-define=FIREBASE_MESSAGING_SENDER_ID=$$FIREBASE_MESSAGING_SENDER_ID
      --dart-define=FIREBASE_APP_ID=$$FIREBASE_APP_ID' &&
      eval $$BUILD_CMD &&
      LAST_HASH='' &&
      while true; do
        CURRENT_HASH=$$(find lib/ -name '*.dart' -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1);
        if [ \"$$CURRENT_HASH\" != \"$$LAST_HASH\" ]; then
          echo 'Detected change, rebuilding...';
          sh /app/gen-firebase-config.sh;
          eval $$BUILD_CMD;
          LAST_HASH=$$CURRENT_HASH;
        fi;
        sleep 2;
      done
      "
    environment:
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    expose:
      - "8080"
    restart: on-failure
    depends_on:
      couchdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/build/web/main.dart.js || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  couchdb:
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=123321k
    expose:
      - "5984"
    volumes:
      - couchdb_data:/usr/local/var/lib/couchdb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flutter:
        condition: service_healthy
      couchdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    restart: on-failure

  seed:
    image: curlimages/curl:8.5.0
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - ./couchdb-seed.sh:/seed.sh:ro
    command: ["sh", "-ec", "sh /seed.sh && exec tail -f /dev/null"]
    environment:
      - COUCHDB_URL=http://couchdb:5984
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=123321k
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u $$COUCHDB_USER:$$COUCHDB_PASSWORD $$COUCHDB_URL/kou-database/stu-201307083 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: on-failure

volumes:
  couchdb_data:
